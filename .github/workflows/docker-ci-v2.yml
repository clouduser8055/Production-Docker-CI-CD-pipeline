name: Production Docker CI

on:
  push: 
    branches:
    - main

  pull_request: 

  workflow_dispatch: 

permissions: 
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    permissions: 
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: 3.13
          cache: "pip" 
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python Syntax
        run: |
          python -m compileall -q .

      - name: Run applicatin smoke test
        run: |
          python hello.py

  docker-verify:
    name: Docker Build and Security Scan
    runs-on: ubuntu-latest

    needs: python-tests
    timeout-minutes: 10

    permissions: 
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Docker Image
        uses: docker/build-push-action@v7.4.0

        with:
          context: .
          file: ./Dockerfile

          platforms: linux/amd64

          push: false
          load: true

          tags: local/python-app:${{ github.sha }}

          cache-from: type=gha,scope=python-app

      - name: Start Web Service
        run: |
          docker run -d --name python-web-service -p 8000:8000 local/python-app:${{ github.sha }}

      - name: Wait for Docker Health
        run: |
          for attempt in {1..40}; do

            status=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              python-web-service)

            echo "Container health: $status"

            if [ "$status" = "healthy" ]; then
              echo "Container is healthy!"
              exit 0
            fi

            if [ "$status" = "unhealthy" ]; then
              docker logs python-web-service
              exit 1
            fi

            sleep 2
          done

          echo "Health check timed out."
          docker logs python-web-service
          exit 1

      - name: Test HTTP Endpoints
        run: |
          echo "Testing home endpoint..."

          curl --fail --silent --show-error \
            http://127.0.0.1:8000/

          echo "Testing health endpoint..."

          response=$(curl --fail --silent --show-error \
            http://127.0.0.1:8000/health)

          echo "$response" | python -c '
          import json
          import sys

          data = json.load(sys.stdin)
          assert data.get("status") == "healthy", data

          print("HTTP health test passed!")
          '

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0

        with:
          image-ref: local/python-app:${{ github.sha }}

          format: table
          exit-code: "1"

          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

        env:
          TRIVY_SKIP_VERSION_CHECK: true

      - name: Show container logs
        if: failure()
        run: |
          docker logs python-web-service || true

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f python-web-service || true


  publish:
    name: Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: 
    - python-tests
    - docker-verify

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'}}

    permissions: 
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup QEMU platforms
        uses: docker/setup-qemu-action@v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0

        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Tags
        id: meta
        uses: docker/metadata-action@v6.1.0

        with:
          images: ${{ env.REGISTRY}}/${{ env.IMAGE_NAME }} 

          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
        
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7.4.0

        with:
          context: .
          file: ./Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha,scope=python-app
          cache-to: type=gha,mode=max,scope=python-app

          sbom: true
          provenance: true

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: 
      - publish

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    timeout-minutes: 15

    permissions: 
      contents: read
      id-token: write

    env:
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      IMAGE_URI: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsEC2Deploy

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Prepare Deployment Parameters
        run: |
          jq -n --arg image "$IMAGE_URI" '{
            commands: [
              "set -eu",
              ("docker pull " + $image),
              "docker rm -f python-web-service || true",
              ("docker run -d --name python-web-service --restart unless-stopped -p 80:8000 " + $image),
              "for attempt in $(seq 1 30); do status=$(docker inspect --format='\''{{.State.Health.Status}}'\'' python-web-service 2>/dev/null || true); if [ \"$status\" = \"healthy\" ]; then echo \"Application is healthy\"; exit 0; fi; sleep 2; done",
              "docker logs python-web-service",
              "exit 1"
            ]
          }' > ssm-parameters.json

      - name: Send Deployment commands
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy commit $GITHUB_SHA" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $CommandId"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Deployment
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          for attempt in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment Status: $STATUS"

            case "$STATUS" in 
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text 
                exit 0
                ;;
              
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Ouput:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 10
          
          done

          echo "Deployment timed out."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json || true

          exit 1


    