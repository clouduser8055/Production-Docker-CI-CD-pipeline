name: Production Docker CI

on:
  push: 
    branches:
    - main

  pull_request: 

  workflow_dispatch: 

permissions: 
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    permissions: 
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: 3.13
          cache: "pip" 
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python Syntax
        run: |
          python -m compileall -q .

      - name: Run applicatin smoke test
        run: |
          python hello.py

  docker-verify:
    name: Docker Build and Security Scan
    runs-on: ubuntu-latest

    needs: python-tests
    timeout-minutes: 10

    permissions: 
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Docker Image
        uses: docker/build-push-action@v7.4.0

        with:
          context: .
          file: ./Dockerfile

          platforms: linux/amd64

          push: false
          load: true

          tags: local/python-app:${{ github.sha }}

          cache-from: type=gha,scope=python-app

      - name: Start Web Service
        run: |
          docker run -d --name python-web-service -p 8000:8000 local/python-app:${{ github.sha }}

      - name: Wait for Docker Health
        run: |
          for attempt in {1..40}; do

            status=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              python-web-service)

            echo "Container health: $status"

            if [ "$status" = "healthy" ]; then
              echo "Container is healthy!"
              exit 0
            fi

            if [ "$status" = "unhealthy" ]; then
              docker logs python-web-service
              exit 1
            fi

            sleep 2
          done

          echo "Health check timed out."
          docker logs python-web-service
          exit 1

      - name: Test HTTP Endpoints
        run: |
          echo "Testing home endpoint..."

          curl --fail --silent --show-error \
            http://127.0.0.1:8000/

          echo "Testing health endpoint..."

          response=$(curl --fail --silent --show-error \
            http://127.0.0.1:8000/health)

          echo "$response" | python -c '
          import json
          import sys

          data = json.load(sys.stdin)
          assert data.get("status") == "healthy", data

          print("HTTP health test passed!")
          '

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0

        with:
          image-ref: local/python-app:${{ github.sha }}

          format: table
          exit-code: "1"

          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

        env:
          TRIVY_SKIP_VERSION_CHECK: true

      - name: Show container logs
        if: failure()
        run: |
          docker logs python-web-service || true

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f python-web-service || true


  publish:
    name: Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: 
    - python-tests
    - docker-verify

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'}}

    permissions: 
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup QEMU platforms
        uses: docker/setup-qemu-action@v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0

        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Tags
        id: meta
        uses: docker/metadata-action@v6.1.0

        with:
          images: ${{ env.REGISTRY}}/${{ env.IMAGE_NAME }} 

          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
        
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7.4.0

        with:
          context: .
          file: ./Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha,scope=python-app
          cache-to: type=gha,mode=max,scope=python-app

          sbom: true
          provenance: true